name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - Thang_AI
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and policy tests
        run: npm run test:ci

      - name: Type-check and build
        run: npm run build

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  deploy-production:
    name: Backend Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
      url: ${{ vars.BACKEND_PRODUCTION_URL }}
    env:
      BACKEND_PRODUCTION_URL: ${{ vars.BACKEND_PRODUCTION_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$BACKEND_PRODUCTION_URL" || { echo "Missing BACKEND_PRODUCTION_URL repository variable"; exit 1; }
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo "Missing RENDER_DEPLOY_HOOK_URL repository secret"; exit 1; }

      - name: Trigger Render deployment
        run: >-
          curl --fail --silent --show-error
          --get --data-urlencode "ref=$GITHUB_SHA"
          "$RENDER_DEPLOY_HOOK_URL" > /dev/null

      - name: Wait for the deployed commit
        shell: bash
        run: |
          health_url="${BACKEND_PRODUCTION_URL%/}/api/health"

          for attempt in {1..90}; do
            response="$(curl --fail --silent --show-error "$health_url" 2>/dev/null || true)"
            deployed_commit="$(jq -r '.commit // empty' <<< "$response" 2>/dev/null || true)"

            if [[ "$deployed_commit" == "$GITHUB_SHA" ]]; then
              echo "Backend deployment is healthy at commit $GITHUB_SHA"
              exit 0
            fi

            echo "Waiting for Render deployment ($attempt/90)..."
            sleep 10
          done

          echo "Backend did not become healthy at commit $GITHUB_SHA within 15 minutes"
          exit 1
